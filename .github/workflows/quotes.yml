# Cotações diárias da Klarity: corre tools/quotes/klarity_quotes.py e publica catalog.csv, quotes.csv e
# fx.csv nas GitHub Pages deste repositório, ao lado das páginas legais que estão em docs/. A app vai buscá-los a https://<utilizador>.github.io/<repo>/.
#
# Funciona tanto com o projeto inteiro no repositório como com um repositório só com a pasta tools/quotes
# (o passo "Encontrar o script" procura o ficheiro onde estiver). Instruções em tools/quotes/README.md.
#
# Antes de correr, descarrega os ficheiros já publicados: o script usa-os para manter a cotação anterior
# quando um fornecedor falha (carry-forward). Se o catálogo estiver inválido o script sai com código 1 e a
# publicação anterior fica como está.

name: Cotações diárias

on:
  schedule:
    # 22:05 UTC todos os dias: 23:05 em Lisboa no inverno, 00:05 no verão, depois do fecho de Nova Iorque.
    - cron: "5 22 * * *"
  push:
    # As páginas legais (docs/*.html) publicam-se logo que mudam, sem esperar pela recolha da noite.
    paths:
      - "docs/*.html"
      - "tools/quotes/catalog_source.csv"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Encontrar o script
        id: script
        run: |
          path="$(git ls-files '*klarity_quotes.py' | head -n 1)"
          if [ -z "$path" ]; then echo "klarity_quotes.py não está no repositório"; exit 1; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$path")" >> "$GITHUB_OUTPUT"

      - name: Descarregar a publicação anterior (carry-forward)
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          # As páginas legais vêm de docs/; os CSV juntam-se-lhes na mesma publicação.
          mkdir -p site
          cp docs/privacy-policy.html docs/terms.html site/ 2>/dev/null || echo "sem páginas legais em docs/"
          for f in catalog.csv quotes.csv fx.csv; do
            curl --fail --silent --show-error --location "$PAGES_URL/$f" --output "site/$f" \
              || echo "sem $f publicado ainda; começa do zero"
          done

      - name: Recolher cotações e câmbio
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python "${{ steps.script.outputs.path }}" --source "${{ steps.script.outputs.dir }}/catalog_source.csv" --out site

      - name: Mostrar o que vai ser publicado
        run: |
          echo "== catalog.csv ($(wc -l < site/catalog.csv) linhas)"
          echo "== quotes.csv"; cat site/quotes.csv
          echo "== fx.csv ($(wc -l < site/fx.csv) linhas)"; tail -n 3 site/fx.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: recolher
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
